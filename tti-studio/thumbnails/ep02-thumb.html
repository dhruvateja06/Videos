<!doctype html>
<!--
  Ep02 thumbnail v2 · System Design vertical
  1920×1080 → renders at landscape-4k (3840×2160) for YouTube.
  Concept: big "DNS & HTTP" title + ONE large readable visual —
  a phone shooting a glowing beam to a far server (the "finding" metaphor).
  Few elements, high contrast, legible at grid size.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face { font-family:"Fraunces"; font-weight:600; src:url("../assets/fonts/fraunces-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family:"Inter"; font-weight:700; src:url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family:"JetBrains Mono"; font-weight:400; src:url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      :root{
        --paper:#0F1729; --panel:#16223C; --panel2:#1B2A47;
        --ink:#E6ECF5; --soft:#B7C2D6; --muted:#7B8AA5; --hair:rgba(123,138,165,.22);
        --accent:#3B7BFF; --accent-bright:#6AA0FF; --ok:#34D399;
      }
      *{ margin:0; padding:0; box-sizing:border-box; }
      html,body{ width:1920px; height:1080px; overflow:hidden; }
      body{ font-family:"Inter",sans-serif; background:var(--paper); }
      #root{ position:relative; width:1920px; height:1080px; background:#0C1322; color:var(--ink); }

      #bg{ position:absolute; inset:0; overflow:hidden; z-index:0; }
      #bggrid{ position:absolute; left:-140px; top:-140px; width:2300px; height:1400px;
        background-image:linear-gradient(rgba(123,138,165,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(123,138,165,.07) 1px,transparent 1px);
        background-size:88px 88px; }
      .glow{ position:absolute; border-radius:50%; filter:blur(120px); pointer-events:none; }
      /* big cobalt bloom behind the right-side visual = depth + contrast */
      #glow_r{ width:1300px; height:1300px; left:1180px; top:-260px;
        background:radial-gradient(circle, rgba(59,123,255,.42), rgba(59,123,255,0) 60%); }
      /* soft bloom behind title */
      #glow_l{ width:1200px; height:1200px; left:-360px; top:-200px;
        background:radial-gradient(circle, rgba(106,160,255,.16), rgba(106,160,255,0) 60%); }
      /* green pop at the destination */
      #glow_g{ width:760px; height:760px; left:1430px; top:80px;
        background:radial-gradient(circle, rgba(52,211,153,.30), rgba(52,211,153,0) 60%); }

      /* brand chrome */
      .hud{ position:absolute; left:60px; right:60px; top:50px; display:flex; justify-content:space-between; align-items:center; z-index:8;
        font-family:"JetBrains Mono"; font-size:27px; letter-spacing:.20em; text-transform:uppercase; color:var(--muted); }
      .hud .l span{ color:var(--accent); }
      .hud .r{ color:var(--soft); }
      .bracket{ position:absolute; width:52px; height:52px; z-index:8; border-color:var(--accent); border-style:solid; border-width:0; }
      #brTL{ left:34px; top:34px; border-left-width:4px; border-top-width:4px; }
      #brTR{ right:34px; top:34px; border-right-width:4px; border-top-width:4px; }
      #brBL{ left:34px; bottom:34px; border-left-width:4px; border-bottom-width:4px; }
      #brBR{ right:34px; bottom:34px; border-right-width:4px; border-bottom-width:4px; }

      /* title */
      .title{ position:absolute; left:96px; top:300px; z-index:6; }
      .eyebrow{ font-family:"JetBrains Mono"; font-size:34px; letter-spacing:.26em; text-transform:uppercase; color:var(--accent-bright); margin-bottom:20px; }
      h1{ font-family:"Fraunces"; font-weight:600; color:#fff; line-height:0.92; letter-spacing:-.02em; font-size:300px;
        text-shadow:0 6px 50px rgba(59,123,255,.35); }
      h1 .amp{ color:var(--accent); font-style:italic; }
      .qline{ font-family:"Inter"; font-weight:700; font-size:54px; line-height:1.12; color:var(--soft); margin-top:40px; max-width:900px; }
      .qline .ac{ color:var(--accent-bright); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ep02thumb" data-start="0" data-duration="1" data-width="1920" data-height="1080">

      <svg width="0" height="0" style="position:absolute"><defs>
        <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
        <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#3B7BFF"/><stop offset="0.6" stop-color="#6AA0FF"/><stop offset="1" stop-color="#34D399"/>
        </linearGradient>
        <linearGradient id="food1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B7BFF"/><stop offset="1" stop-color="#6AA0FF"/></linearGradient>
        <linearGradient id="food2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#3B7BFF"/></linearGradient>
      </defs></svg>

      <div id="bg">
        <div id="bggrid"></div>
        <div class="glow" id="glow_l"></div>
        <div class="glow" id="glow_r"></div>
        <div class="glow" id="glow_g"></div>
      </div>

      <div class="hud"><div class="l">THE TECH INTERN <span>// SYSTEM DESIGN</span></div><div class="r">EP 02</div></div>
      <div class="bracket" id="brTL"></div><div class="bracket" id="brTR"></div>
      <div class="bracket" id="brBL"></div><div class="bracket" id="brBR"></div>

      <div class="title">
        <div class="eyebrow">how your phone finds the server</div>
        <h1>DNS <span class="amp">&amp;</span> HTTP</h1>
        <div class="qline">Out of <span class="ac">a billion</span> computers — in half a second.</div>
      </div>

      <!-- ONE big visual: phone, glowing beam, server -->
      <svg width="900" height="1080" viewBox="0 0 900 1080" style="position:absolute; right:0; top:0; z-index:5; overflow:visible;">
        <!-- glowing beam (under-glow + bright core) -->
        <path d="M250 760 C 430 560, 470 420, 660 300" stroke="url(#beam)" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.35" filter="url(#blur)"/>
        <path d="M250 760 C 430 560, 470 420, 660 300" stroke="url(#beam)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="2 26"/>
        <!-- travelling packet, frozen near the server -->
        <circle cx="612" cy="332" r="30" fill="#6AA0FF" opacity="0.4" filter="url(#blur)"/>
        <circle cx="612" cy="332" r="15" fill="#9CC2FF"/>

        <!-- PHONE (big, lower-left of the visual zone) -->
        <g>
          <rect x="70" y="540" width="300" height="470" rx="44" fill="#0B1322" stroke="#6AA0FF" stroke-width="5"/>
          <rect x="70" y="540" width="300" height="470" rx="44" fill="none" stroke="rgba(59,123,255,.30)" stroke-width="14"/>
          <text x="104" y="600" font-size="26" fill="#B7C2D6" font-family="JetBrains Mono">9:41</text>
          <text x="104" y="652" font-size="36" fill="#fff" font-family="Inter" font-weight="700">Swiggy</text>
          <rect x="104" y="676" width="232" height="44" rx="22" fill="#16223C" stroke="var(--hair)"/>
          <rect x="104" y="742" width="232" height="104" rx="14" fill="#111c33" stroke="var(--hair)"/>
          <rect x="120" y="758" width="72" height="72" rx="10" fill="url(#food1)"/>
          <rect x="208" y="766" width="112" height="16" rx="5" fill="#E6ECF5"/><rect x="208" y="794" width="78" height="14" rx="5" fill="#7B8AA5"/>
          <rect x="104" y="864" width="232" height="104" rx="14" fill="#111c33" stroke="var(--hair)"/>
          <rect x="120" y="880" width="72" height="72" rx="10" fill="url(#food2)"/>
          <rect x="208" y="888" width="112" height="16" rx="5" fill="#E6ECF5"/><rect x="208" y="916" width="78" height="14" rx="5" fill="#7B8AA5"/>
        </g>

        <!-- SERVER (big, upper-right, green-glow = found) -->
        <g>
          <circle cx="660" cy="300" r="142" fill="none" stroke="#34D399" stroke-width="3" opacity="0.5" filter="url(#blur)"/>
          <rect x="540" y="186" width="240" height="228" rx="26" fill="#101b30" stroke="#34D399" stroke-width="5"/>
          <rect x="572" y="222" width="176" height="46" rx="9" fill="none" stroke="#6AA0FF" stroke-width="3"/><circle cx="596" cy="245" r="8" fill="#34D399"/>
          <rect x="572" y="284" width="176" height="46" rx="9" fill="none" stroke="#6AA0FF" stroke-width="3"/><circle cx="596" cy="307" r="8" fill="#34D399"/>
          <rect x="572" y="346" width="176" height="46" rx="9" fill="none" stroke="#6AA0FF" stroke-width="3"/><circle cx="596" cy="369" r="8" fill="#6AA0FF"/>
          <text x="660" y="166" font-size="26" fill="#34D399" font-family="JetBrains Mono" text-anchor="middle" letter-spacing="2">SERVER</text>
        </g>
      </svg>
    </div>
  </body>
</html>

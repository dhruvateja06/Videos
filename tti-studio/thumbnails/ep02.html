<!doctype html>
<!--
  THE TECH INTERN — System Design · Ep02 thumbnail (1280×720, render @2x).
  Shares the series style/chrome from template.html, but the HERO + the
  right-side diagram are episode-specific (so episodes don't look identical):
    HERO  = DNS & HTTP  (not "SYSTEM DESIGN" — that's already in the brand tag)
    DIAGRAM = the DNS lookup: name (swiggy.com) → DNS → IP address
  Render: node thumbnails/render.mjs --file thumbnails/ep02.html --out assets/thumbnails/sd-ep02-dns-http.png
-->
<html><head><meta charset="UTF-8"/>
<style>
  @font-face { font-family:"Inter"; font-weight:700; src:url("../assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:600; src:url("../assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-weight:400; src:url("../assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:400; src:url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#0E1420; --ink:#E8EFF7; --soft:#AEBFD4; --muted:#7186A4; --hair:rgba(125,170,210,.22);
         --cyan:#2DD4BF; --cyanb:#5EEAD4; --o:#FF6B2C; --ob:#FF8A55; }
  body{ margin:0; }
  #tb{ position:relative; width:1280px; height:720px; overflow:hidden; font-family:"Inter",sans-serif;
       background:radial-gradient(130% 110% at 16% 8%, #1A2C4D 0%, #101B30 42%, #0A1018 78%, #070B12 100%); }

  #grid{ position:absolute; inset:-40px; background-image:linear-gradient(rgba(125,170,210,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(125,170,210,.06) 1px, transparent 1px); background-size:50px 50px;
         -webkit-mask-image:radial-gradient(120% 100% at 60% 40%, #000 35%, transparent 85%); }
  .glow{ position:absolute; border-radius:50%; filter:blur(75px); }
  #gc{ width:680px; height:680px; right:-150px; top:-200px; background:radial-gradient(circle, rgba(45,212,191,.40), rgba(45,212,191,0) 70%); }
  #gc2{ width:520px; height:520px; right:120px; bottom:-220px; background:radial-gradient(circle, rgba(56,189,248,.20), rgba(56,189,248,0) 70%); }
  #go{ width:520px; height:520px; left:-200px; bottom:-230px; background:radial-gradient(circle, rgba(255,107,44,.26), rgba(255,107,44,0) 70%); }
  #vig{ position:absolute; inset:0; box-shadow:inset 0 0 240px 60px rgba(2,5,10,.85); pointer-events:none; }
  .pt{ position:absolute; width:7px; height:7px; border-radius:50%; background:var(--cyanb); box-shadow:0 0 14px var(--cyanb); opacity:.8; }
  #p1{ left:520px; top:120px; } #p2{ left:600px; top:560px; opacity:.5; } #p3{ left:120px; top:470px; opacity:.45; }
  #p4{ left:760px; top:90px; width:5px; height:5px; opacity:.6; } #p5{ left:1180px; top:520px; opacity:.5; }
  #bignum{ position:absolute; right:24px; bottom:-110px; font-family:"Inter"; font-weight:700; font-size:600px; line-height:1; letter-spacing:-.05em;
          color:transparent; -webkit-text-stroke:2px rgba(94,234,212,.07); }

  .corner{ position:absolute; width:44px; height:44px; border:3px solid var(--hair); }
  .tl{ left:34px; top:34px; border-right:0; border-bottom:0; } .tr{ right:34px; top:34px; border-left:0; border-bottom:0; }
  .bl{ left:34px; bottom:34px; border-right:0; border-top:0; } .br{ right:34px; bottom:34px; border-left:0; border-top:0; }

  .left{ position:absolute; left:76px; top:0; height:720px; width:720px; display:flex; flex-direction:column; justify-content:center; }
  .ep{ display:inline-flex; align-items:center; gap:12px; align-self:flex-start; background:linear-gradient(180deg,#FF7A3C,#F2540E); color:#fff;
       font-family:"JetBrains Mono"; font-size:25px; letter-spacing:.22em; padding:12px 26px; border-radius:9px;
       box-shadow:0 8px 34px rgba(255,107,44,.5), inset 0 1px 0 rgba(255,255,255,.3); }
  h1{ font-family:"Inter"; font-weight:700; font-size:150px; line-height:.9; letter-spacing:-.04em; margin-top:24px; }
  h1 .w{ color:#fff; text-shadow:0 6px 40px rgba(0,0,0,.55); display:block; }
  h1 .cy{ display:block; background:linear-gradient(100deg,#5EEAD4 0%, #2DD4BF 55%, #22B8E6 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
          filter:drop-shadow(0 0 36px rgba(45,212,191,.5)); }
  .topic{ display:flex; align-items:center; gap:18px; margin-top:34px; font-family:"Inter"; font-weight:600; font-size:48px; color:var(--soft); letter-spacing:-.01em; }
  .topic b{ color:#fff; font-weight:700; }
  .topic .bar{ width:11px; height:48px; background:linear-gradient(180deg,#FF8A55,#FF6B2C); border-radius:5px; box-shadow:0 0 20px rgba(255,107,44,.7); }
  .micro{ font-family:"JetBrains Mono"; font-size:25px; color:var(--muted); margin-top:18px; letter-spacing:.02em; }

  /* diagram (DNS lookup: name → dns → ip) */
  .diagram{ position:absolute; right:74px; top:50%; transform:translateY(-50%); width:330px; height:486px; filter:drop-shadow(0 24px 50px rgba(0,0,0,.5)); }
  .node{ position:absolute; width:330px; height:124px; border-radius:22px; display:flex; align-items:center; gap:24px; padding:0 28px;
         background:linear-gradient(160deg,#22344F 0%, #16243B 55%, #0F1B2E 100%); border:2px solid rgba(125,170,210,.28);
         box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 12px 36px rgba(0,0,0,.45); }
  .node.cyan{ border-color:rgba(45,212,191,.65); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 46px rgba(45,212,191,.3), 0 12px 36px rgba(0,0,0,.45); }
  .node.orange{ border-color:rgba(255,107,44,.7); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 46px rgba(255,107,44,.3), 0 12px 36px rgba(0,0,0,.45); }
  .node .icw{ width:66px; height:66px; flex:none; border-radius:14px; display:flex; align-items:center; justify-content:center;
              background:rgba(45,212,191,.1); border:1px solid rgba(45,212,191,.3); }
  .node.orange .icw{ background:rgba(255,107,44,.1); border-color:rgba(255,107,44,.35); }
  .node .ic{ width:42px; height:42px; }
  .node .tx .t{ font-family:"JetBrains Mono"; font-size:17px; letter-spacing:.14em; color:var(--cyan); text-transform:uppercase; }
  .node.orange .tx .t{ color:var(--ob); }
  .node .tx .n{ font-family:"Inter"; font-weight:700; font-size:31px; color:#fff; margin-top:3px; }
  .node .tx .n.ip{ font-family:"JetBrains Mono"; font-weight:400; font-size:26px; letter-spacing:-.01em; }
  #n1{ top:0; } #n2{ top:181px; } #n3{ top:362px; }
  .wire{ position:absolute; left:163px; width:5px; background:linear-gradient(180deg, var(--cyanb), rgba(45,212,191,.3)); border-radius:3px; box-shadow:0 0 18px rgba(45,212,191,.7); }
  #w1{ top:124px; height:57px; } #w2{ top:305px; height:57px; }
  .arrow{ position:absolute; left:155px; width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:14px solid var(--cyanb); filter:drop-shadow(0 0 8px rgba(94,234,212,.8)); }
  #a1{ top:170px; } #a2{ top:351px; }
  .dot{ position:absolute; left:157px; width:17px; height:17px; border-radius:50%; background:#fff; box-shadow:0 0 18px var(--cyanb), 0 0 4px #fff; }
  #d1{ top:140px; } #d2{ top:321px; }

  .brandtag{ position:absolute; left:76px; bottom:54px; font-family:"JetBrains Mono"; font-size:24px; letter-spacing:.2em; color:var(--muted); text-transform:uppercase; }
  .brandtag span{ color:var(--cyan); }
</style></head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="ic-globe" viewBox="0 0 100 100"><circle cx="50" cy="50" r="33" fill="none" stroke="#5EEAD4" stroke-width="5"/><ellipse cx="50" cy="50" rx="14" ry="33" fill="none" stroke="#5EEAD4" stroke-width="4"/><line x1="17" y1="50" x2="83" y2="50" stroke="#5EEAD4" stroke-width="4"/></symbol>
    <symbol id="ic-search" viewBox="0 0 100 100"><circle cx="44" cy="44" r="25" fill="none" stroke="#5EEAD4" stroke-width="6"/><line x1="62" y1="62" x2="82" y2="82" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round"/></symbol>
    <symbol id="ic-pin" viewBox="0 0 100 100"><path d="M50 88 C 30 60, 22 46, 22 36 a28 28 0 0 1 56 0 c0 10 -8 24 -28 52 Z" fill="none" stroke="#FF8A55" stroke-width="5" stroke-linejoin="round"/><circle cx="50" cy="36" r="11" fill="none" stroke="#FF8A55" stroke-width="5"/></symbol>
  </defs></svg>

  <div id="tb">
    <div id="grid"></div>
    <div class="glow" id="gc"></div><div class="glow" id="gc2"></div><div class="glow" id="go"></div>
    <div id="bignum">02</div>
    <div class="pt" id="p1"></div><div class="pt" id="p2"></div><div class="pt" id="p3"></div><div class="pt" id="p4"></div><div class="pt" id="p5"></div>
    <div id="vig"></div>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

    <div class="left">
      <span class="ep">EPISODE 02</span>
      <h1><span class="w">DNS &amp;</span><span class="cy">HTTP</span></h1>
      <div class="topic"><span class="bar"></span><b>Client &amp; Server</b></div>
      <div class="micro">how your phone finds the server</div>
    </div>

    <div class="diagram">
      <div class="node cyan" id="n1"><span class="icw"><svg class="ic"><use href="#ic-globe"/></svg></span><div class="tx"><div class="t">Name</div><div class="n">swiggy.com</div></div></div>
      <div class="wire" id="w1"></div><div class="dot" id="d1"></div><div class="arrow" id="a1"></div>
      <div class="node cyan" id="n2"><span class="icw"><svg class="ic"><use href="#ic-search"/></svg></span><div class="tx"><div class="t">DNS</div><div class="n">the phonebook</div></div></div>
      <div class="wire" id="w2"></div><div class="dot" id="d2"></div><div class="arrow" id="a2"></div>
      <div class="node orange" id="n3"><span class="icw"><svg class="ic"><use href="#ic-pin"/></svg></span><div class="tx"><div class="t">IP address</div><div class="n ip">142.250.193.4</div></div></div>
    </div>

    <div class="brandtag">THE TECH INTERN <span>// SYSTEM DESIGN</span></div>
  </div>
</body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../../assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Fraunces"; font-weight:600; font-style:normal; src:url("../../assets/fonts/fraunces-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family:"Fraunces"; font-weight:400; font-style:normal; src:url("../../assets/fonts/fraunces-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family:"Fraunces"; font-weight:400; font-style:italic; src:url("../../assets/fonts/fraunces-latin-400-italic.woff2") format("woff2"); }
      @font-face { font-family:"Inter"; font-weight:400; font-style:normal; src:url("../../assets/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family:"Inter"; font-weight:600; font-style:normal; src:url("../../assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family:"Inter"; font-weight:700; font-style:normal; src:url("../../assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }

      :root{ --paper:#FAF8F3; --panel:#F2EFE7; --ink:#16181D; --soft:#41444B; --muted:#8E8A80; --hair:#E0DBD0; --o:#FF6B2C; --osoft:#FFF1E8; }
      *{ margin:0; padding:0; box-sizing:border-box; }
      html,body{ width:1920px; height:1080px; overflow:hidden; }
      body{ font-family:"Inter",sans-serif; background:var(--paper); }
      #root{ position:relative; width:1920px; height:1080px; background:var(--paper); }
      .spine{ position:absolute; left:0; top:0; bottom:0; width:22px; background:var(--o); z-index:6; }

      #bg{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
      #bgdots{ position:absolute; left:-200px; top:-200px; width:2400px; height:1560px;
        background-image:radial-gradient(circle, rgba(22,24,29,.055) 2px, transparent 2.6px);
        background-size:62px 62px; }
      .blob{ position:absolute; border-radius:50%; filter:blur(34px); }
      #blob1{ width:680px; height:680px; left:1080px; top:-180px;
        background:radial-gradient(circle, rgba(255,107,44,.20), rgba(255,107,44,0) 70%); }
      #blob2{ width:620px; height:620px; left:-180px; top:560px;
        background:radial-gradient(circle, rgba(255,107,44,.13), rgba(255,107,44,0) 70%); }

      #wipe{ position:absolute; top:-60px; bottom:-60px; left:0; width:420px; opacity:0; z-index:20; pointer-events:none;
        background:linear-gradient(90deg, rgba(255,107,44,0) 0%, var(--o) 32%, #ff8a55 50%, var(--o) 68%, rgba(255,107,44,0) 100%);
        transform:skewX(-11deg); }

      .scene{ position:absolute; inset:0; opacity:0; z-index:2; padding:90px 200px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
      .kick{ font-size:24px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--o); margin-bottom:28px; }
      h1{ font-family:"Fraunces",serif; font-weight:600; color:var(--ink); line-height:1.05; letter-spacing:-.015em; }
      .sub{ font-family:"Fraunces",serif; font-style:italic; color:var(--soft); }
      .o{ color:var(--o); } .it{ font-style:italic; }

      .next-card{ display:flex; align-items:center; gap:36px; background:#FCFBF8; border:2px solid var(--hair); border-radius:18px; padding:30px 42px; margin-top:30px; opacity:0; }
      .next-card .ep{ font-family:"Fraunces",serif; font-weight:600; font-size:32px; color:var(--o); flex:none; }
      .next-card .ti{ font-family:"Fraunces",serif; font-weight:400; font-style:italic; font-size:34px; color:var(--ink); }

      .cta-row{ display:flex; gap:30px; margin-top:50px; justify-content:center; }
      .cta{ display:flex; align-items:center; gap:18px; padding:24px 38px; border-radius:14px; opacity:0; }
      .cta.solid{ background:var(--o); color:#fff; }
      .cta.ghost{ background:transparent; border:2px solid var(--ink); color:var(--ink); }
      .cta .ico{ font-size:30px; }
      .cta .tx{ font-family:"Inter",sans-serif; font-weight:700; font-size:26px; letter-spacing:.04em; text-transform:uppercase; }

      .signoff{ font-family:"Fraunces",serif; font-style:italic; font-size:44px; color:var(--muted); margin-top:48px; opacity:0; }
      .channel{ position:absolute; left:200px; bottom:80px; display:flex; align-items:center; gap:20px; opacity:0; }
      .channel .dot{ width:48px; height:48px; border-radius:50%; background:var(--o); }
      .channel .nm{ font-family:"Fraunces",serif; font-weight:600; font-size:34px; color:var(--ink); }
      .channel .nm .sm{ display:block; font-family:"Inter",sans-serif; font-style:normal; font-weight:400; font-size:18px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ep02outro" data-start="0" data-duration="35" data-width="1920" data-height="1080">
      <div id="bg">
        <div id="bgdots"></div>
        <div class="blob" id="blob1"></div>
        <div class="blob" id="blob2"></div>
      </div>
      <div class="spine" id="spine"></div>
      <div id="wipe"></div>

      <div class="scene clip" id="s16" data-start="0" data-duration="35" data-track-index="0">
        <div class="kick" id="s16k">Next time on The Tech Intern</div>
        <h1 id="s16t" style="font-size:72px; max-width:1500px;">The framework <span class="o">every AI system</span><br>on Earth uses.</h1>

        <div class="next-card" id="s16card" style="max-width:1300px;">
          <div class="ep">EP 03</div>
          <div class="ti">Data → Model → Prediction</div>
        </div>

        <div class="cta-row" id="s16ctas">
          <div class="cta solid" id="s16cta1"><span class="ico">▶</span><span class="tx">Subscribe</span></div>
          <div class="cta ghost" id="s16cta2"><span class="ico">↗</span><span class="tx">Share with a friend</span></div>
        </div>

        <div class="signoff" id="s16sign">See you in the next one.</div>
      </div>

      <div class="channel" id="s16ch">
        <div class="dot"></div>
        <div class="nm">The Tech Intern<span class="sm">tech, explained from day one</span></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#spine", { scaleY:0, transformOrigin:"top", duration:0.6, ease:"power2.out" }, 0);
      tl.to("#spine",  { opacity:0.72, duration:2.4, ease:"sine.inOut", repeat:30, yoyo:true }, 0.7);
      tl.to("#bgdots", { x:-40,  y:-28, duration:30, ease:"sine.inOut", repeat:2, yoyo:true }, 0);
      tl.to("#blob1",  { x:-110, y:80,  scale:1.12, duration:26, ease:"sine.inOut", repeat:2, yoyo:true }, 0);
      tl.to("#blob2",  { x:90,   y:-70, scale:1.16, duration:30, ease:"sine.inOut", repeat:2, yoyo:true }, 0);

      tl.set("#wipe", { opacity:1 }, 0);
      tl.fromTo("#wipe", { x:-720 }, { x:2240, duration:0.85, ease:"power2.inOut" }, 0);
      tl.set("#wipe", { opacity:0 }, 0.9);

      tl.fromTo("#s16",  { opacity:0 }, { opacity:1, duration:0.45, ease:"power1.out" }, 0.3);
      tl.fromTo("#s16k", { opacity:0, x:-26 }, { opacity:1, x:0, duration:0.55, ease:"power2.out" }, 0.35);
      tl.fromTo("#s16t", { opacity:0, y:50, scale:0.96 }, { opacity:1, y:0, scale:1, duration:0.9, ease:"back.out(1.3)" }, 0.75);

      tl.fromTo("#s16card", { opacity:0, y:30, scale:0.97 }, { opacity:1, y:0, scale:1, duration:0.7, ease:"back.out(1.4)" }, 4.789);
      tl.to("#s16card", { y:-6, duration:2.2, ease:"sine.inOut", repeat:8, yoyo:true }, 7.5);

      tl.fromTo("#s16cta1", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.6)", transformOrigin:"center" }, 16.666);
      tl.fromTo("#s16cta2", { opacity:0, y:22, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.55, ease:"back.out(1.6)", transformOrigin:"center" }, 17.066);
      tl.to("#s16cta1", { scale:1.04, duration:1.1, ease:"sine.inOut", repeat:12, yoyo:true, transformOrigin:"center" }, 14);

      tl.fromTo("#s16sign", { opacity:0, y:18 }, { opacity:1, y:0, duration:0.7, ease:"power2.out" }, 28.578);
      tl.fromTo("#s16ch", { opacity:0, x:-30 }, { opacity:1, x:0, duration:0.7, ease:"power2.out" }, 2);
      tl.to("#s16",  { y:-20, duration:1.4, ease:"power1.in" }, 33.5);

      window.__timelines["ep02outro"] = tl;
    </script>
  </body>
</html>

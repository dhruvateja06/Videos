<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family:"Fraunces"; font-weight:600; font-style:normal; src:url("assets/fonts/fraunces-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family:"Fraunces"; font-weight:400; font-style:italic; src:url("assets/fonts/fraunces-latin-400-italic.woff2") format("woff2"); }
      @font-face { font-family:"Inter"; font-weight:700; font-style:normal; src:url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family:"JetBrains Mono"; font-weight:400; font-style:normal; src:url("assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
      *{ margin:0; padding:0; box-sizing:border-box; }
      html,body{ width:1920px; height:1080px; overflow:hidden; }
      body{ font-family:"Inter",sans-serif; background:#0F1729; }
      #root{ position:relative; width:1920px; height:1080px;
        background:radial-gradient(120% 110% at 18% 10%, #16223C 0%, #0F1729 55%, #0A1018 100%); color:#E6ECF5; }
      .corner{ position:absolute; width:42px; height:42px; border:3px solid rgba(123,138,165,.3); }
      .tl{ left:46px; top:46px; border-right:0; border-bottom:0; } .tr{ right:46px; top:46px; border-left:0; border-bottom:0; }
      .bl{ left:46px; bottom:46px; border-right:0; border-top:0; } .br{ right:46px; bottom:46px; border-left:0; border-top:0; }
      .wrap{ position:absolute; left:150px; top:50%; transform:translateY(-50%); }
      .eyebrow{ font-family:"JetBrains Mono",monospace; font-size:26px; letter-spacing:.22em; text-transform:uppercase; color:#3B7BFF; }
      .title{ font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:158px; line-height:.96; color:#E6ECF5; letter-spacing:-.01em; margin-top:20px; }
      .title .a{ color:#3B7BFF; }
      .rule{ height:5px; width:360px; background:#3B7BFF; margin-top:30px; transform-origin:left center; box-shadow:0 0 22px rgba(59,123,255,.6); }
      .tag{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:40px; color:#B7C2D6; margin-top:26px; }
      .motif{ position:absolute; right:130px; bottom:140px; width:520px; height:170px; }
      .motif svg{ width:100%; height:100%; overflow:visible; }
      .hopr{ fill:#16223C; stroke:rgba(123,138,165,.4); stroke-width:2; }
      .hopt{ font-family:"JetBrains Mono",monospace; font-size:15px; fill:#7B8AA5; letter-spacing:.06em; }
      .wire{ stroke:rgba(123,138,165,.5); stroke-width:2.5; fill:none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="frame clip" id="frame" data-start="0" data-duration="6" data-track-index="0">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>

      <div class="wrap clip" id="hero" data-start="0" data-duration="6" data-track-index="1">
        <div class="eyebrow" id="eyebrow">// SYSTEM DESIGN</div>
        <div class="title" id="title">THE TECH <span class="a">INTERN</span></div>
        <div class="rule" id="rule"></div>
        <div class="tag" id="tag">systems, explained from day one</div>
      </div>

      <div class="motif clip" id="motif" data-start="0" data-duration="6" data-track-index="2">
        <svg viewBox="0 0 520 170">
          <path class="wire" id="wire" d="M70 60 H170 M270 60 H370 M470 60 H470" />
          <line class="wire" x1="70" y1="60" x2="470" y2="60" id="bus"/>
          <g id="hops">
            <g class="hop"><rect class="hopr" x="20" y="40" width="100" height="40" rx="9"/><text class="hopt" x="70" y="65" text-anchor="middle">CLIENT</text></g>
            <g class="hop"><rect class="hopr" x="170" y="40" width="100" height="40" rx="9"/><text class="hopt" x="220" y="65" text-anchor="middle">SERVER</text></g>
            <g class="hop"><rect class="hopr" x="320" y="40" width="100" height="40" rx="9"/><text class="hopt" x="370" y="65" text-anchor="middle">DB</text></g>
          </g>
          <circle id="packet" cx="120" cy="60" r="7" fill="#6AA0FF"/>
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from(".corner", { opacity:0, duration:0.6, ease:"power2.out" }, 0.0);
      tl.from("#eyebrow", { opacity:0, x:-20, duration:0.5, ease:"power2.out" }, 0.3);
      tl.from("#title", { opacity:0, y:40, duration:0.7, ease:"power3.out" }, 0.6);
      tl.from(".a", { color:"#E6ECF5", duration:0.5 }, 1.2);
      tl.from("#rule", { scaleX:0, duration:0.6, ease:"power2.out" }, 1.3);
      tl.from("#tag", { opacity:0, y:14, duration:0.5, ease:"power2.out" }, 1.7);

      const bus = document.getElementById("bus");
      const len = (bus.getTotalLength && bus.getTotalLength()) || 400;
      tl.from(".hop", { opacity:0, y:14, scale:0.8, transformOrigin:"center", duration:0.4, ease:"back.out(1.6)", stagger:0.14 }, 1.0);
      tl.fromTo("#bus", { strokeDasharray:len, strokeDashoffset:len }, { strokeDashoffset:0, duration:0.7, ease:"power2.inOut" }, 1.6);
      tl.fromTo("#packet", { attr:{ cx:120 } }, { attr:{ cx:420 }, duration:1.6, ease:"none", repeat:1 }, 2.4);
      tl.to(".a", { opacity:0.85, duration:0.9, yoyo:true, repeat:1 }, 3.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

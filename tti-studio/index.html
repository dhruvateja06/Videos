<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-weight: 600;
        font-style: normal;
        src: url("assets/fonts/fraunces-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Fraunces";
        font-weight: 400;
        font-style: italic;
        src: url("assets/fonts/fraunces-latin-400-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-weight: 700;
        font-style: normal;
        src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      body { font-family: "Inter", sans-serif; background: #FAF8F3; }
      #root { position: relative; width: 1920px; height: 1080px; background: #FAF8F3; }
      .spine { position: absolute; left: 0; top: 0; bottom: 0; width: 26px; background: #FF6B2C; }
      .wrap { position: absolute; left: 150px; top: 50%; transform: translateY(-50%); }
      .eyebrow { font-family: "Inter", sans-serif; font-size: 26px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: #8E8A80; }
      .title { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 168px; line-height: .98; color: #16181D; letter-spacing: -.01em; margin-top: 18px; }
      .title .o { color: #FF6B2C; }
      .rule { height: 5px; width: 360px; background: #16181D; margin-top: 30px; transform-origin: left center; }
      .tag { font-family: "Fraunces", Georgia, serif; font-style: italic; font-size: 40px; color: #41444B; margin-top: 26px; }
      .motif { position: absolute; right: 150px; bottom: 150px; width: 320px; height: 220px; }
      .motif svg { width: 100%; height: 100%; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="spine clip" id="spine" data-start="0" data-duration="6" data-track-index="0"></div>

      <div class="wrap clip" id="hero" data-start="0" data-duration="6" data-track-index="1">
        <div class="eyebrow" id="eyebrow">The Tech Intern · Lesson 01</div>
        <div class="title" id="title">THE TECH <span class="o">INTERN</span></div>
        <div class="rule" id="rule"></div>
        <div class="tag" id="tag">tech, explained from day one</div>
      </div>

      <div class="motif clip" id="motif" data-start="0" data-duration="6" data-track-index="2">
        <svg viewBox="0 0 320 220">
          <line x1="20" y1="10" x2="20" y2="195" stroke="#16181D" stroke-width="2.5"/>
          <line x1="20" y1="195" x2="305" y2="195" stroke="#16181D" stroke-width="2.5"/>
          <g fill="#FF6B2C">
            <circle class="dot" cx="55"  cy="170" r="7"/>
            <circle class="dot" cx="95"  cy="150" r="7"/>
            <circle class="dot" cx="130" cy="155" r="7"/>
            <circle class="dot" cx="165" cy="128" r="7"/>
            <circle class="dot" cx="200" cy="112" r="7"/>
            <circle class="dot" cx="235" cy="96"  r="7"/>
            <circle class="dot" cx="275" cy="74"  r="7"/>
          </g>
          <line id="fit" x1="40" y1="178" x2="295" y2="66" stroke="#16181D" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#spine", { scaleY: 0, transformOrigin: "top", duration: 0.6, ease: "power2.out" }, 0.0);
      tl.from("#eyebrow", { opacity: 0, y: -18, duration: 0.5, ease: "power2.out" }, 0.3);
      tl.from("#title", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 0.6);
      tl.from(".o", { color: "#16181D", duration: 0.5 }, 1.2);
      tl.from("#rule", { scaleX: 0, duration: 0.6, ease: "power2.out" }, 1.3);
      tl.from("#tag", { opacity: 0, y: 14, duration: 0.5, ease: "power2.out" }, 1.7);

      const fit = document.getElementById("fit");
      const len = (fit.getTotalLength && fit.getTotalLength()) || 280;
      fit.style.strokeDasharray = len;
      tl.from(".dot", { scale: 0, transformOrigin: "center", duration: 0.4, ease: "back.out(2)", stagger: 0.08 }, 1.0);
      tl.fromTo("#fit", { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 2.0);

      tl.to(".o", { opacity: 0.9, duration: 0.8, yoyo: true, repeat: 1 }, 3.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
